        <dialog id="group-form-dialog" class="rounded-lg shadow">
            <form id="groups-form" class="flex flex-col gap-5 p-4 pt-2 pb-2 pb-0">
                <div>
                    <label for="title" class="block text-sm font-medium mb-1">Group title</label>
                    <input id="title" type="text" required placeholder=" inter group name" name="groups"
                        class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="group category" class="block text-sm font-medium mb-1">Category</label>
                    <input id="group-category" required placeholder="enter group category" type="text"
                        class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="status" class="block text-sm font-medium mb-1">Status</label>
                    <select id="status"
                        class="w-full border border-slate-300 rounded px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Active">Active</option>
                        <option value="Done">Done</option>
                    </select>
                </div>
                <div>
                    <label for="group-date" class="font-bold ">Date :</label>
                    <input type="date" id="group-date" name="Date" class="bg-cyan-600 p-4 ">
                </div>
                <button onclick="creatGroup()" id="add-group-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold rounded px-4 py-2">
                    Submit Group
                </button>
            </form>
        </dialog>

        <dialog id="memebers-form-dialog" class="rounded-lg shadow">

            <form id="members-form" class="bg-cyan-600 rounded-lg shadow p-4 pt-2 pb-2 pb-0 flex flex-col gap-4">
                <div>
                    <label for="members" class="block text-sm font-medium mb-1">Full Name</label>
                    <div class="flex gap-2 items-center justify-around">
                        <input id="member-full-name" placeholder="enter group memebers" name="member"
                            class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></input>
                    </div>
                    <div id="members-list"></div>
                </div>
                <div>
                    <label for="expense" class="block text-sm font-medium mb-1">pseudo-name</label>
                    <div class="flex gap-2 items-center justify-around">
                        <input id="membre-pseudo-name" rows="3" placeholder="enter pseudo-name"
                            class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></input>
                    </div>
                    <div id="expenses-list"></div>
                </div>
                <button onclick="addpMember()" type="button"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold rounded px-4 py-2"
                    id="add-mumbers-infos-btn">
                    Add
                </button>
                <button onclick="closeMemberFormClick()" id="add-group-btn" type="button"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold rounded px-4 py-2">
                    Cancel
                </button>
            </form>
        </dialog>

        <dialog id="members-dialog" class="max-w-xl rounded-lg shadow">
            <div id="" class="bg-cyan-950 text-xl font-bold flex flex-col gap-3 p-2 rounded-2xl">
                <div class="flex justify-between">
                    <span id="group-title" class="flex flex-col items-center text-cyan-50 font-bold text-2xl font-serif">group title </span>
                    <button onclick="closeMemberClick()" class="text-sm p-2 bg-blue-400">click </button>                    
                </div>
                <ul id="members-list">
                    <div id="members-list-items" class="flex flex-col gap-2">
                        <li>
                            <div class=" bg-sky-800 p-2 flex items-center justify-between rounded-2xl ">
                                <div class="flex gap-2 items-center ">
                                    <span id="member-name" class="font-bold text-cyan-50 text-2xl">Amin</span>
                                    <button id="edit-member-btn"
                                        class="p-2 bg-cyan-100 rounded-full hover:bg-blue-200"><a href=""><img
                                                src="asessts/pencil (1).png" alt="pincel icone to edit memers infos"
                                                title="edit member" width="20" height="20"></a></button>
                                </div>
                                <div>
                                    <span id="deservs" class="text-green-400 text-sm ">▲ 20$</span>
                                    <span id="on-you" class="text-red-400 text-sm ">▼ 50$</span>
                                </div>
                                <div class="flex flex-col items-center gap-1">
                                    <span id="montant-paid" class="font-bold text-3xl text-amber-400 ">400 $</span>
                                    <button id="delete-member-btn"
                                        class="p-2 bg-cyan-100 rounded-full hover:bg-red-100 "><img
                                            src="asessts/trash-can-list.png" alt="bin icon" title="delete member"
                                            width="20" height="20"></button>
                                </div>
                            </div>
                        </li>
                    </div>
                </ul>
            </div>
        </dialog>
    </main>
    
    <script  src="./js/membres.js"></script>
    <script  src="./js/groupes.js"></script>
    <script>
        const groupFormDialog = document.getElementById("group-form-dialog")
        const membersFormDialog = document.getElementById("memebers-form-dialog")
        const membersDialog = document.getElementById("members-dialog")

        function showGroupClick() {
            groupFormDialog.showModal()
        }
        function closeGroupClick() {
            groupFormDialog.close()
        }

        function showMemberFormClick() {
            membersFormDialog.showModal()
        }
        function closeMemberFormClick() {
            membersFormDialog.close()
        }

        function showMemberClick() {
            membersDialog.showModal()
        }
        function closeMemberClick() {
            membersDialog.close()
        }
    </script>

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
