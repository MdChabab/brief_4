<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/line.css">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <title>SplitMate</title>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800">

    <header id="head" class="max-w-xl mx-auto p-6 pt-6 pb-0 flex justify-between">
        <h1 class="text-3xl font-bold flex items-center">SplitMate</h1>
        <a href="./formulair.html"><button
                class="rounded-md bg-blue-500 p-3 text-white hover:text-blue-800 hover:bg-white">Add new
                group</button></a>
    </header>
  
    <!--main-->

    <main class="max-w-xl mx-auto p-6">
        <p id="empty-message" hidden>No groups are created yet. Add one from the + sign above</p>
        <ul id="group-list" class="space-y-3 bg-gray rounded-lg shadow p-4">
            <!-- EXAMPLE task: shows how a task should look. Delete this <li> once your JavaScript works. -->
            <li id="trip-card" class="bg-white rounded-lg shadow p-4 pb-0">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <h3 class="font-semibold">Tobkal Trip</h3>
                        <p class="text-sm text-slate-600 mt-1">x members</p>
                        <span class="inline-block text-xs bg-green-200 rounded-full px-2 py-1 mt-2">active</span>
                    </div>
                    <div class="flex flex-col items-end gap-2 justify-center h-full">
                        <p id="total-amount" class="text-sm font-bold text-yellow-600">500$</p>
                    </div>
                </div>
                <div id="see-more-arrows" class="flex justify-center">
                    <button onclick="openSeeMore()">
                        <svg style="width: 20px;" xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 24 24"
                            viewBox="0 0 24 24" id="angle-double-down">
                            <path fill="#6563FF"
                                d="M11.3,11.5c0.2,0.2,0.4,0.3,0.7,0.3c0.3,0,0.5-0.1,0.7-0.3l3-3c0.4-0.4,0.4-1,0-1.4c-0.4-0.4-1-0.4-1.4,0L12,9.3L9.7,7c-0.4-0.4-1-0.4-1.4,0c-0.4,0.4-0.4,1,0,1.4L11.3,11.5z M14.3,12.5L12,14.8l-2.3-2.3c-0.4-0.4-1-0.4-1.4,0c-0.4,0.4-0.4,1,0,1.4l3,3c0.2,0.2,0.4,0.3,0.7,0.3c0.3,0,0.5-0.1,0.7-0.3l3-3c0.4-0.4,0.4-1,0-1.4C15.3,12.2,14.7,12.2,14.3,12.5z">
                            </path>
                        </svg>
                    </button>
                </div>
            </li>
        </ul>
    </main>

    <!--footer-->
    <footer></footer>
    <script src="./js/depenses.js"></script>
</body>

</html>
