<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <title>SplitMate</title>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800">

    <header id="head" class="max-w-xl bg-yellow-500 mx-auto p-3 flex justify-between">
        <h1 class="text-4xl text-orange-950  font-bold flex items-center">SplitMate</h1>
        <a href="./formulair.html"><button class="rounded-md bg-blue-500 p-3 text-white hover:text-blue-800 hover:bg-white">Add new group</button></a>
    </header>

    <!--main-->

    <main class="max-w-xl mx-auto p-3">
        <p id="empty-message" hidden>No groups are created yet. Add one from the + sign above</p>
        <ul id="groups-list" class="space-y-3">
            <!-- EXAMPLE task: shows how a task should look. Delete this <li> once your JavaScript works. -->
            <li class="bg-white rounded-lg shadow p-4 flex items-start justify-between gap-4" data-id="">
                <div>
                    <h3 class="font-bold text-2xl">Tobkal Trip</h3>
                    <p class="text-xl text-slate-600 mt-1">x memebers</p>
                    <span class="inline-block text-xs bg-green-200 rounded-full px-2 py-1 mt-2">active</span>
                </div>
                <div class="flex flex-col items-end gap-2 justify-center h-full">
                    <p id="total-amount" class="text-3xl font-bold text-yellow-600">500$</p>
                    <button class="text-sm hover:text-blue-800 font-medium">
                        see more >
                    </button>
                    <button class="text-red-700 text-sm font-bold">Delete</button>
                </div>
            </li>
        </ul>
    </main>

    <!--footer-->
    <footer style="background-color: whitesmoke;"></footer>
</body>

</html>
