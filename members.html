<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitMate-groups-members</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>

<body class=" min-h-screen bg-cyan-100">
    <header class="max-w-xl mx-auto p-3 pt-4 pb-0 flex flex-col justify-between">
        <h1 class="text-3xl font-bold items-center">SplitMate</h1>
        <h2 class="text-sm font-bold text-cyan-950">Members</h2>
    </header>
    <main class="max-w-xl mx-auto p-3">
        <div id="" class="bg-cyan-950 text-xl font-bold flex flex-col gap-3 p-2 rounded-2xl">
            <div id="group-title" class="flex flex-col items-center text-cyan-50 font-bold text-2xl font-serif">Tobkal trip</div>
            <ul id="members-list" gap-2>
                <div id="members-list-items" class="flex flex-col gap-2">
                    <li>
                        <div class=" bg-sky-800 p-2 flex items-center justify-between rounded-2xl ">
                            <div class="flex gap-2 items-center ">
                            <span id="member-name" class="font-bold text-cyan-50 text-2xl">Amin</span>
                            <button id="edit-member-btn" class="p-2 bg-cyan-100 rounded-full hover:bg-blue-200" ><a href=""><img src="asessts/pencil (1).png" alt="pincel icone to edit memers infos" title="edit member" width="20" height="20"></a></button>
                            </div>
                            <div>
                                <span id="deservs" class="text-green-400 text-sm ">▲ 20$</span>
                                <span id="on-you" class="text-red-400 text-sm ">▼ 50$</span>
                            </div>
                            <div class="flex flex-col items-center gap-1">
                                <span id="montant-paid" class="font-bold text-3xl text-amber-400 ">400 $</span>
                               <button id="delete-member-btn" class="p-2 bg-cyan-100 rounded-full hover:bg-red-100 " ><img src="asessts/trash-can-list.png" alt="bin icon" title="delete member" width="20"
                                    height="20" ></button>
                            </div>
                        </div>
                    </li>
                </div>
            </ul>
        </div>
    </main>
</body>

</html>
