<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>splitMate</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

</head>

<body class=" min-h-screen bg-cyan-100">
    <header class="max-w-xl mx-auto p-3 pt-4 pb-0">
        <h1  class="text-3xl font-bold flex items-center">SplitMate</h1>
        <p class="font-bold text-ycan-600 ">share you expenses</p>
    </header>

    <main class="max-w-xl mx-auto p-3">
        <form id="groups-form" class="bg-cyan-600 rounded-lg shadow p-4 pt-2 pb-2 pb-0">
            <div>
                <label for="title" class="block text-sm font-medium mb-1">Group title</label>
                <input id="title" type="text" required placeholder=" inter group name"
                    class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <label for="members-adding" class="block text-sm font-medium mb-1">Add members</label>

            <div class="flex gap-2 items-center justify-around">
                <input id="mumbers" rows="3" placeholder="inter your frindes names"
                    class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></input>
                <button
                    class="w-24 h-10 bg-blue-600 hover:bg-blue-700 border-slate-300 rounded text-emerald-50 font-bold">Add</button>
            </div>
            <div id="members-list"></div>
            <div>
                <label for="status" class="block text-sm font-medium mb-1">Status</label>
                <select id="status"
                    class="w-full border border-slate-300 rounded px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Active">Active</option>
                    <option value="Done">Done</option>
                </select>
            </div>
            <label for="group-date" class="font-bold ">Date :</label>
            <input type="date" id="group-date" name="Date" class="bg-cyan-600 p-4 ">

            <button onclick="getGroupsInput()" id="add-group-btn" type="button"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold rounded px-4 py-2">
                Submit Group
            </button>

                <div>
                    <select name="" id="">
                        <option value="">Select member</option>
                        <option value="">oussama</option>
                        <option value="">mohammed</option>
                    </select>
            </form> -->
    </main>
</body>

</html>
