<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members form</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

</head>

<body class=" min-h-screen bg-cyan-100">
    <header class="max-w-xl mx-auto p-3 flex-col justify-between">
        <h1 class="text-3xl font-bold flex items-center">SplitMate</h1>
        <p class="font-bold">share you expenses</p>
    </header>
    <main class="max-w-xl mx-auto p-3">
        <form id="members-form" class="bg-cyan-600 rounded-lg shadow p-4 pt-2 pb-2 pb-0 flex flex-col gap-4">
            <div>
                <label for="members drop down" class="block text-sm font-medium mb-1">Members</label>
                <select id="members-drop-down"
                    class="w-full border border-slate-300 rounded px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Select member</option>
                    <option value="">chi wahd</option>
                </select>
            </div>
            <div>
                <label for="category" class="block text-sm font-medium mb-1">category</label>
                <div class="flex gap-2 items-center justify-around">
                    <input id="categories" placeholder="what they paid for"
                        class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></input>
                    <button class="w-24 h-10 bg-blue-600 hover:bg-blue-700 border-slate-300 rounded px-3 text-emerald-50 font-bold">Add</button>
                </div>
                <div id="categories-list"></div>
            </div>
            <div>
                <label for="expense" class="block text-sm font-medium mb-1">expense</label>
                <div class="flex gap-2 items-center justify-around">
                    <input id="expense" rows="3" placeholder="enter expense"
                        class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></input>
                    <button class="w-24 h-10 bg-blue-600 hover:bg-blue-700 border-slate-300 rounded px-3 text-emerald-50 font-bold">Add</button>
                </div>
                <div id="expenses-list"></div>
            </div>
            <button type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold rounded px-4 py-2"
                id="add-mumbers-infos-btn">
                add expense
            </button>
        </form>
    </main>
</body>

</html>
